<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>叁笙清理 · 空间与选择</title>
<style>
:root{color-scheme:light dark;--paper:#faf7f0;--ink:#243c2d;--green:#2f5d3a;--gbg:#2f5d3a;--onG:#fff;--gold:#a57924;--line:#d9ddcf;--muted:#68756a;--white:#fffefa;--amber:#88611e;--red:#8a4a3a;--track:#e8ebe0;--rest:#cfd2c6;--sys:#a9ad9f;--on:#f3f1e5;--dock:#243c2d}
@media(prefers-color-scheme:dark){:root{--paper:#161d18;--ink:#e4e8dc;--green:#8fc79b;--gbg:#8fc79b;--onG:#10200f;--gold:#d4a84e;--line:#2e3a31;--muted:#9aa89c;--white:#1e2a22;--amber:#d9b06a;--red:#e0a090;--track:#26322a;--rest:#4a5448;--sys:#69725f;--on:#1f2c23;--dock:#1d2b22}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:5px 12px;background:var(--white)}
button:hover{border-color:var(--green)}button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input[type=checkbox]{width:17px;height:17px;margin:0;accent-color:var(--green);cursor:pointer}
header,.page{max-width:1240px;margin:auto;padding-left:28px;padding-right:28px}
header{display:flex;align-items:center;gap:28px;padding-top:6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;flex:none}.logo{width:104px;height:36px;object-fit:contain}
.brand strong{font-size:16px;font-weight:600;border-left:1px solid var(--line);padding-left:14px}
.disk{margin-left:auto;width:min(560px,60%);min-width:0;font-size:12px;color:var(--muted)}
.disk-meta{display:flex;justify-content:space-between;gap:4px 16px;flex-wrap:wrap;margin-bottom:3px}
.disk-meta span,.disk-meta time{white-space:nowrap}
.capacity{display:flex;height:28px;border-radius:4px;overflow:hidden;background:var(--track);color:var(--ink)}
.capacity-segment{display:flex;align-items:center;justify-content:center;flex:none;min-width:0;text-align:center}
.capacity-used{background:var(--gbg);color:var(--onG)}.capacity-free{background:var(--track)}
.capacity-label{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:0 10px;white-space:nowrap;font-size:12px}
.capacity-label strong{font-size:16px;font-weight:600}
.capacity-legend{display:none;justify-content:space-between;gap:8px;margin-top:5px;font-size:12px;color:var(--ink)}
.disk.labels-below .capacity{height:16px}.disk.labels-below .capacity-label{visibility:hidden}.disk.labels-below .capacity-legend{display:flex}
.disk.labels-below .capacity-legend span{white-space:nowrap}
.page{display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;padding-top:16px}
/* 左侧目录：挂在页面左边，跟着滚动停住 */
.side{position:sticky;top:0;height:calc(100vh - 150px);display:flex;flex-direction:column}
.dockbox{flex:1;min-height:0;display:flex;align-items:center}
.dock{width:100%;max-height:calc(100% - 24px);overflow-y:auto;overscroll-behavior:contain}
.side-foot{flex:none;display:flex;flex-wrap:wrap;gap:2px 8px;padding:6px 4px 0;font-size:11px}
.side-foot a,.main-foot a{color:var(--muted);text-decoration:none}.side-foot a:hover,.main-foot a:hover{color:var(--green)}
.main-foot{display:none;flex-wrap:wrap;gap:4px 10px;margin-top:16px;font-size:11px}
.mod-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 10px 4px;font-size:12px;color:var(--muted)}
.mod-h b{font-weight:600}
.mod-bar{height:3px;margin:0 10px 6px;background:var(--track);border-radius:2px;overflow:hidden;display:none}.mod-bar span{display:block;height:100%;background:var(--green)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;justify-content:space-between;align-items:baseline;gap:8px;text-align:left;border:0;border-radius:8px;background:transparent;padding:6px 10px;font-size:13px}
.nav .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .r{flex:none;font-size:12px;color:var(--muted);white-space:nowrap}.nav .r b{font-weight:600;color:var(--green)}
.nav button.keep .nm{color:var(--muted)}
.mod-top .nav button{font-weight:600}
/* 目录：深绿底悬浮导航岛，垂直居中 */
.dock{background:var(--dock);border:1px solid var(--line);color:#eef0e6;border-radius:16px;padding:10px;box-shadow:0 16px 40px rgba(36,60,45,.28),0 2px 8px rgba(36,60,45,.12)}
.mod{padding:8px 0}.mod+.mod{border-top:1px solid rgba(255,255,255,.10)}
.mod-h{color:#fff;font-size:14px;font-weight:650;padding:4px 10px 6px}.mod-h>span:last-child{font-size:12px;font-weight:400;color:rgba(238,240,230,.6)}.mod-h b{color:#e2c483}
.mod .nav button{padding:5px 10px 5px 22px;font-size:13px;font-weight:400;color:rgba(238,240,230,.82);flex-wrap:wrap;row-gap:4px}
.nav .r{color:rgba(238,240,230,.55)}.nav .r b{color:#e2c483;font-weight:600}
.nav button.keep .nm{color:rgba(238,240,230,.5)}
.mod-top .nav button{padding:6px 10px;font-size:14px;font-weight:650;color:#fff}
.nav .r b.new{color:#e2c483}
.vol{flex-basis:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.vol i{display:block;height:100%;background:rgba(238,240,230,.28);border-radius:2px;position:relative}
.vol i b{position:absolute;left:0;top:0;bottom:0;background:#e2c483;border-radius:2px}
.brand a{display:flex}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current=true]{background:rgba(255,255,255,.12);color:#fff}
/* 右侧 */
.main{min-width:0;padding-bottom:20px}
.main h1{font-size:23px;font-weight:600;margin:0 0 20px;line-height:1.35}
.lead{margin:4px 0 0;color:var(--muted)}
.stack{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--track);margin:16px 0 6px}
.stack span{display:block;height:100%;min-width:2px}.stack span+span{border-left:2px solid var(--paper)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
table.cats{width:100%;border-collapse:collapse;margin-top:14px}
.cats th{font-size:12px;font-weight:500;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
.cats th:first-child{text-align:left}
.cats td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:top}
.cats td:first-child{text-align:left;white-space:normal}
.cats tr.go{cursor:pointer}.cats tr.go:hover td{background:var(--white)}
.cats .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px}
.cats .muted{color:var(--muted)}.cats .can{color:var(--green);font-weight:600}
.cats tr.grp td{font-size:12px;color:var(--muted);padding-top:16px;border-bottom:0}
.cats .ex{display:block;font-size:12px;color:var(--muted);margin:2px 0 0 18px;max-width:560px}
.tally{display:flex;gap:28px;flex-wrap:wrap;margin:14px 0 4px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tally small{display:block;font-size:12px;color:var(--muted)}.tally strong{font-size:19px;font-weight:600}
.subh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 2px;padding:0 4px 6px;border-bottom:1px solid var(--line)}
.subh h2{font-size:14px;font-weight:600;margin:0;color:var(--muted)}
.subh label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
/* 条目：左边文字，右边体积和勾选 */
.item{display:grid;grid-template-columns:minmax(0,1fr) auto 28px;gap:4px 16px;padding:12px 4px;border-bottom:1px solid var(--line)}
.item .tt{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.item .sz{font-weight:650;font-size:16px;white-space:nowrap;text-align:right}
.item .ck{display:flex;justify-content:center;padding-top:3px}
.item .ck .kp{font-size:12px;color:var(--muted)}
.item .sub{grid-column:1;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .q{grid-column:1;font-size:13px;overflow-wrap:anywhere}
.item .risk{grid-column:1;font-size:13px;color:var(--amber)}
.item .down{grid-column:1;font-size:13px;color:var(--muted)}
.item .down b{display:block;font-weight:600;color:var(--amber);font-size:12px}
.item .down ul{margin:2px 0 0;padding-left:16px}
.item details{grid-column:1}
.item.keep .tt,.item.keep .sz{font-weight:500}
.item.on{background:var(--on)}
.tag{display:inline-block;font-size:12px;line-height:1.5;padding:0 6px;border:1px solid var(--green);color:var(--green);border-radius:4px;margin-left:8px;font-weight:400;vertical-align:1px}
details.more{font-size:13px}details.more summary{cursor:pointer;color:var(--green);font-size:12px;width:max-content}
details.more dl{display:grid;grid-template-columns:6em minmax(0,1fr);gap:4px 12px;margin:8px 0 2px}
details.more dt{color:var(--muted)}details.more dd{margin:0;overflow-wrap:anywhere}details.more ul{margin:0;padding-left:16px}
code{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere;word-break:break-all}
.sc{color:var(--muted);font-size:12px}
.none{padding:16px 4px;color:var(--muted)}
.tips{margin-top:28px}.tips h2{font-size:15px;margin:0 0 6px}
.tip{padding:10px 0;border-bottom:1px solid var(--line)}.tip .tt{font-weight:600}.tip p{margin:2px 0 0}
.tip .done{color:var(--green)}
.note{margin-top:22px;max-width:520px}.note label{font-size:12px}.note label span{color:var(--muted)}
.note input{display:block;width:100%;margin:3px 0 0;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--white)}
.quick{display:flex;gap:4px;flex-wrap:nowrap;white-space:nowrap}
.quick button{font-size:12px;padding:4px 10px;border-radius:999px}
.quick button[aria-pressed=true]{background:var(--gbg);color:var(--onG);border-color:var(--gbg)}
.lvl{display:inline-block;font-size:11px;line-height:1.5;padding:0 6px;border-radius:4px;margin-left:8px;font-weight:400;vertical-align:2px;border:1px solid}
.lvl.safe{color:var(--green);border-color:var(--green)}.lvl.recommended{color:var(--muted);border-color:var(--line)}.lvl.all{color:var(--amber);border-color:var(--gold)}
.newtip{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--white);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:8px 14px;margin:0 0 14px}
.newtip button{flex:none;background:var(--gbg);border-color:var(--gbg);color:var(--onG)}
.setline{margin:22px 0 12px;font-size:13px;color:var(--muted)}
.setline summary{cursor:pointer;width:max-content}.setline[open] summary{margin-bottom:10px}
.setting-list{display:grid;grid-template-columns:10em minmax(0,1fr);gap:8px 16px;margin:0;padding:12px 0;border-top:1px solid var(--line)}
.setting-list dt{color:var(--ink)}.setting-list dd{margin:0;overflow-wrap:anywhere}
.asks{margin:14px 0 6px}.asks h2{font-size:15px;margin:0 0 6px}
.qcard{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;background:var(--white)}
.qcard.done{opacity:.8}
.qcard .qt{flex:1 1 280px;min-width:0;overflow-wrap:anywhere}.qcard .qt small{display:block;color:var(--muted);font-size:12px}.qcard .qt .rmeans{display:block;margin-top:4px;color:var(--muted);font-size:13px}
.seg{display:flex;white-space:nowrap;max-width:100%}
.seg button{border-radius:0;margin-left:-1px;font-size:12px;padding:5px 12px}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}.seg button:last-child{border-radius:0 6px 6px 0}
.seg button[aria-pressed=true]{background:var(--gbg);color:var(--onG);border-color:var(--gbg)}
.choice{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.choice small{color:var(--muted);font-size:12px}
.comp{margin:14px 0 4px}.comp h2,.models h2,.deep h2{font-size:14px;font-weight:600;margin:0 0 6px;color:var(--muted)}
.comp .stack{margin:6px 0}.comp .legend{display:flex;flex-wrap:wrap;gap:2px 18px;font-size:13px}.comp .legend span.k{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.comp .purge{margin:4px 0 0;font-size:13px;color:var(--muted)}
.comp{overflow-wrap:anywhere}.comp a{color:var(--green);text-underline-offset:3px}.asks>summary{cursor:pointer;font-weight:600}
.composition{margin:0 0 28px}.composition .stack{height:32px;margin:12px 0 14px;border-radius:6px}
.composition .legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 24px}
.composition .legend-item{display:flex;flex-direction:column;gap:2px}.composition .legend-item>span{font-size:12px;color:var(--muted)}
.composition .legend-item strong{padding-left:16px;font-size:20px;font-weight:600}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:22px 0 0}
.section-head h2{font-size:16px;font-weight:600;margin:0}.section-head p{margin:0;font-size:13px;color:var(--muted)}
.section-head strong{color:var(--green);font-size:18px;font-weight:600;margin-left:6px}
.growth-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:18px 0 22px;border-bottom:1px solid var(--line)}
.growth-stats small{display:block;font-size:12px;color:var(--muted)}.growth-stats strong{font-size:24px;font-weight:600;white-space:nowrap}
.growth-list{list-style:none;margin:24px 0;padding:0}.growth-list li{margin:0 0 24px}
.growth-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px}.growth-row code{font-size:14px}.growth-row strong{white-space:nowrap}
.growth-track{height:7px;border-radius:3px;overflow:hidden;background:var(--track);margin:7px 0}.growth-track span{display:block;height:100%;background:var(--green)}
.growth-list p{margin:6px 0}.growth-list details{font-size:12px;color:var(--muted)}.growth-list summary{cursor:pointer;width:max-content}
.models{margin:12px 0 0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--white);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.models.go{cursor:pointer}.models.go:hover{border-color:var(--green)}
.deep{margin:16px 0 0}.deep ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.deep li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding:8px 4px;border-bottom:1px solid var(--line)}
.deep li .sz{font-weight:650;white-space:nowrap}.deep li .sc{grid-column:1/-1}
.cloud{margin:12px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--white)}
.cloud h2{font-size:14px;font-weight:600;margin:0 0 4px;color:var(--ink)}.cloud .hint{margin:0 0 6px}
.cloud ol{list-style:none;margin:0;padding:0}
.cloud li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding:8px 0;border-top:1px solid var(--line)}
.cloud li .sz{font-weight:650;white-space:nowrap}.cloud li .sc,.cloud li .how{grid-column:1/-1}.cloud li .how{font-size:13px}
.cloud li a{color:var(--green)}
.archrow{display:none;max-width:1240px;margin:auto;padding:8px 28px 0;font-size:13px}.archrow.on{display:block}
.archrow label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.archrow input{flex:1 1 260px;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--white)}
.pq{grid-column:1;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.pq button{font-size:12px;padding:2px 10px;border-radius:999px}
.pq button[aria-pressed=true]{background:var(--gbg);color:var(--onG);border-color:var(--gbg)}
.hide-btn{grid-column:1;justify-self:start;border:0;background:none;padding:0;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.hide-btn:hover{color:var(--green)}
.item.hidden-rule{opacity:.55}
/* 底部选择栏 */
.selbar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);margin-top:12px}
.selbar .in{max-width:1240px;margin:auto;padding:10px 28px;display:flex;align-items:center;gap:16px}
.selbar strong{font-size:15px}.hint{font-size:12px;color:var(--muted)}.hint.bad{color:var(--red)}
.selbar .copywrap{margin-left:auto;text-align:right}.selbar .primary{white-space:nowrap}
.selbar .copywrap .hint{margin-top:2px}
.primary{background:var(--gbg);color:var(--onG);border-color:var(--gbg);padding:7px 16px}.primary:hover{border-color:var(--ink)}
.feedback{font-size:12px;color:var(--muted);min-height:18px}
.fallback{width:100%;height:120px;margin-top:6px}
@media(max-width:780px){
 header,.page,.selbar .in{padding-left:16px;padding-right:16px}
 header{flex-wrap:wrap;gap:6px 12px}.brand{gap:10px}.brand strong{font-size:15px;padding-left:10px}.logo{width:92px;height:32px}.disk{width:100%;text-align:left}
 .page{display:block}
 .side{position:sticky;top:0;z-index:2;height:auto;background:var(--paper);border-bottom:1px solid var(--line);overflow-x:auto;padding:6px 0;margin-bottom:12px;display:block}
 .dock{display:flex;gap:4px;max-height:none;overflow:visible;background:transparent;border:0;box-shadow:none;padding:0;color:inherit}
 .mod{display:flex;padding:0;border:0;background:transparent;box-shadow:none;margin:0}
 .mod-h,.mod-bar,.vol{display:none!important}.nav{flex-direction:row;gap:4px}
 .dockbox{display:block}.side-foot{display:none}.main-foot{display:flex}
 .nav button{border:1px solid var(--line);background:var(--white);white-space:nowrap;color:var(--ink)}
 .nav .r,.nav button.keep .nm{color:var(--muted)}.nav .r b{color:var(--green)}
 .nav button[aria-current=true]{border-color:var(--green);color:var(--green);background:var(--white)}
 .cats .hide-m{display:none}
 .quick button{padding:3px 8px}
 .archrow{padding-left:16px;padding-right:16px}
 .seg{flex-wrap:wrap}
 .selbar .in{gap:8px;flex-wrap:wrap}.selbar #selection-help{font-size:11px}.selbar strong{font-size:13px;white-space:nowrap}
 .quick{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto}
 .growth-stats{gap:12px}.growth-stats strong{font-size:19px}
 .setting-list{grid-template-columns:1fr;gap:2px}.setting-list dd{margin-bottom:8px}
}
@media(max-width:420px){.capacity-label{gap:4px;line-height:1.25;padding:0 2px}.capacity-label strong{font-size:14px}.composition .legend{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.growth-stats{grid-template-columns:1fr 1fr}.growth-stats>div:first-child{grid-column:1/-1}.growth-stats>div:first-child strong{font-size:28px}}

</style>

<script id="export-lib">
// 导出文本的纯函数：测试在 node 里执行这段，再用 scripts/prefs.py 的 parse_ledger / parse_board_export 解析核对。
const STATUS_ZH={active:'进行中',done:'做完了',archived:'归档',protected:'别碰'};
// Python 的 splitlines 会在这些字符处断行；JSON 里一律写成转义，保证“台账:”整行不被拆开
const safeLine=s=>s.replace(/[\u0085\u2028\u2029]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'));
function ledgerLine(entries){ // entries：[{key,name,status,deliverables(数组或 null)}]
  const o=Object.create(null);
  for(const e of entries){if(!STATUS_ZH[e.status])continue;
    const v={'状态':STATUS_ZH[e.status]};
    if(Array.isArray(e.deliverables))v['成品']=e.deliverables;
    if(e.name)v['名称']=e.name;
    o[e.key]=v}
  return '台账: '+safeLine(JSON.stringify({'项目':o}));
}
// 备注是自由文本，进的是按行解析的清单：控制字符、NEL、行/段分隔符（Python splitlines 会在这些处断行）一律换成空格，再折叠空白
function cleanNote(v){return String(v==null?'':v).replace(/[\x00-\x1f\x7f\x85\u2028\u2029]/g,' ').replace(/\s+/g,' ').trim()}
// 归档目标：必须是外接硬盘 /Volumes/<盘名>/…，不许有 . 或 .. 段；真正的“是不是另一块盘、能不能写”由 act.py 现场核对
function archivePathOk(p){p=cleanNote(p).replace(/\/+$/,'');const seg=p.split('/');return /^\/Volumes\/[^\/]+(\/[^\/]+)*$/.test(p)&&!seg.includes('.')&&!seg.includes('..')}
function archiveNorm(p){return cleanNote(p).replace(/\/+$/,'')}
function archiveLine(p){return '归档到: '+archiveNorm(p)}
// 待确认规则：只导出形如 p1 的编号，文字本身不进清单
function ruleLines(confirmIds,rejectIds){
  const ok=a=>[...new Set(a)].filter(x=>/^[A-Za-z0-9_-]+$/.test(x)).sort();
  const c=ok(confirmIds||[]),r=ok(rejectIds||[]),out=[];
  if(c.length)out.push('确认规则: '+c.join(','));
  if(r.length)out.push('不要规则: '+r.join(','));
  return out;
}
function reviewMessage(scanId,questions,answers){
  const rows=questions.filter(q=>answers.has(q.id)).map(q=>({id:q.id,title:q.title,answer:answers.get(q.id)}));
  return ['叁笙清理 · 待核查答复','scan_id: '+cleanNote(scanId),
    '答复: '+safeLine(JSON.stringify(rows)),'这里只选择核查方向，不授权删除。'].join('\n');
}

<script>
'use strict';
const D=JSON.parse(document.getElementById('plan-data').textContent);
const facts=D.facts||{}, plan=D.plan||{}, check=D.check||{errors:[]}, seal=D.seal||null;
const $=id=>document.getElementById(id);
const E=(tag,text,cls)=>{const el=document.createElement(tag);if(text!=null)el.textContent=text;if(cls)el.className=cls;return el};
const fmtBytes=n=>{n=+n||0;const a=Math.abs(n);if(a<1000)return Math.trunc(n)+' B';const sg=n<0?'-':'';
  for(const [u,d] of [['KB',1e3],['MB',1e6],['GB',1e9],['TB',1e12]]){const v=a/d;if(Number(v.toFixed(1))<1000||u==='TB')return sg+v.toFixed(1)+' '+u}}; // 十进制一位小数，与 scripts/units.py 的 fmt_bytes 逐值一致
const gb=n=>{if(n==null)return'未统计';if(n<=0)return'0';return fmtBytes(n)};
const g1=n=>(Math.round((n||0)/1e8)/10).toLocaleString('zh-CN',{minimumFractionDigits:1,maximumFractionDigits:1}); // 目录里的短写：9.7
const LABEL={clean:'建议清理',decide:'需你决定',keep:'保留'};
const SCOPE={all:'整个目录','ignored-only':'只删 git 忽略的文件',files:'指定文件'};
const COLORS=['#2f5d3a','#5f8a6a','#93ad86','#a57924','#c9a35a','#4f7270','#7f9c9a','#b7a37a','#8c9a6c','#6e7a63','#dcd6c4'];
const CATS=(plan.categories&&plan.categories.length?plan.categories:[{id:'other',name:'其他',section:'',desc:''}]);
const catIndex=new Map(CATS.map((c,i)=>[c.id,i]));
const colorOf=id=>COLORS[(catIndex.get(id)||0)%COLORS.length];
const cards=(plan.cards||[]).filter(c=>LABEL[c.verdict]).sort((a,b)=>(b.bytes||0)-(a.bytes||0));
// 待定卡的预填：plan.py 写 prefill（删 / 归档）；只是预选，仍要用户确认。归档只在 archive_enabled 为真时认
const ARCH=D.archive_enabled===true;
// 含“软件自带命令”（native）条目的卡没法归档（act.py 会跳过它们）：不给“归档”选项，预填的归档也不认。plan.py 标 archivable:false；条目列表被截断时以这个标记为准，列出的条目里有 native 也算
const canArch=c=>ARCH&&c.archivable!==false&&!(c.items||[]).some(it=>it&&it.method==='native');
const prefillMode=c=>{const v=c.prefill||(D.proposal&&D.proposal.prefill&&D.proposal.prefill[c.id])||null;return v==='删'||(v==='归档'&&canArch(c))?v:null};
const prefillOf=c=>prefillMode(c)!==null;
// 勾选＝要处理，没勾＝不动。clean 卡按 plan.py 算出的 default_select 预勾选；decide 卡只有被预填（项目做完了等）才预选，选项是 删 / 留 / 归档
const modeOf=new Map(); // decide 卡的回答：删 / 归档 / 留
const picked=new Set(cards.filter(c=>(c.verdict==='clean'&&c.default_select===true)||(c.verdict==='decide'&&prefillOf(c))).map(c=>c.id));
cards.filter(c=>c.verdict==='decide'&&prefillOf(c)).forEach(c=>modeOf.set(c.id,prefillMode(c)));
const catOf=c=>catIndex.has(c.category)?c.category:'other';
const sum=a=>a.reduce((n,c)=>n+(c.bytes||0),0);
const act=c=>c.verdict!=='keep';
const isSel=c=>act(c)&&picked.has(c.id);
const isDecide=c=>c.verdict==='decide';
function setPick(c,on){ // 勾上 / 取消；decide 卡勾上默认是“删”，已选了归档的保持
  if(on){picked.add(c.id);if(isDecide(c)&&modeOf.get(c.id)!=='归档')modeOf.set(c.id,'删')}
  else{picked.delete(c.id);if(isDecide(c))modeOf.delete(c.id)}
}
let view='overview';
// 项目问题：一题一卡。status 是当前回答，orig 是打开页面时的状态（null＝还没标；久没动的“进行中”项目 orig 是 active）
const PQ=(D.proposal&&D.proposal.project_questions)||[];
const REVIEW=(D.proposal&&D.proposal.review_questions)||[];
const REVIEWED=new Map(((D.review_status||{}).entries||[]).filter(r=>r&&r.status==='investigated'&&REVIEW.some(q=>q.id===r.id)).map(r=>[r.id,r]));
const reviewAns=new Map();
const newQ=PQ.find(q=>q.type==='new_projects');
const PROJ=new Map();
function addProj(p){if(PROJ.has(p.key))return PROJ.get(p.key);const r={p,orig:p.status||null,status:p.status||null};PROJ.set(p.key,r);return r}
const QCARDS=[];
for(const p of ((newQ&&newQ.projects)||[])){addProj({key:p.key,name:p.name});QCARDS.push({kind:'new',key:p.key,name:p.name,bytes:p.bytes})}
const newMore=Math.max(0,((newQ&&newQ.count)||0)-QCARDS.length);
for(const q of PQ.filter(q=>q.type==='stale_active')){addProj({key:q.key,name:q.name,status:'active'});QCARDS.push({kind:'stale',key:q.key,name:q.name,days:q.idle_days})}
// 待确认的规则：用户在设置页“补充”里说的话，Agent 翻译后等她点头
const RULES=(D.pending_rules||[]).filter(r=>r&&typeof r.id==='string'&&r.text);   // r.means（可为空）= 实际生效的释义
const ruleAns=new Map(); // id -> confirm | reject
const ledgerEntries=()=>[...PROJ.values()].filter(r=>r.status&&r.status!==r.orig)
  .map(r=>({key:r.p.key,name:r.p.name,status:r.status,deliverables:null}));
const SEG=[['active','进行中'],['done','做完了'],['archived','归档'],['protected','别碰']];
const shp=p=>String(p||'').replace(/^\/Users\/[^/]+/,'~');
const hiddenKeys=new Set();   // “以后别列这类”：规则键
const PRESET=[['safe','稳妥','删了不丢东西：软件会自己重新下载，或本来就是失败、废弃的记录。'],
  ['recommended','推荐','稳妥的全部，再加有副本的、任务已经做完的过程记录和中间稿。以后要改得重新生成。'],
  ['all','全部可删','再加删了就找不回来的，比如没有副本的图、模拟器里的数据。确认都不要了再选。']];
const RANK={safe:0,recommended:1,all:2};
const inPreset=(c,p)=>act(c)&&c.preset&&RANK[c.preset]<=RANK[p]&&!hiddenKeys.has(c.rule_key);
const presetCards=p=>cards.filter(c=>inPreset(c,p));
function choosePreset(p){picked.clear();for(const [k,v] of [...modeOf])if(v!=='留')modeOf.delete(k);presetCards(p).forEach(c=>setPick(c,true));render()}
function activePreset(){const ids=[...picked].sort().join();for(const [p] of PRESET){if(presetCards(p).map(c=>c.id).sort().join()===ids&&ids)return p}return ''}
const LVL={safe:'稳妥',recommended:'推荐',all:'慎重'};
const openAsks=()=>QCARDS.filter(q=>{const r=PROJ.get(q.key);return r.status===r.orig}).length+RULES.filter(r=>!ruleAns.has(r.id)).length;

const dk=facts.disk||{}, cov=facts.coverage||{};
const used=dk.used!=null?dk.used:(dk.total>0?dk.total-dk.free:0);
const scanTime=facts.created_at?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(facts.created_at)):'';
$('disk-total').textContent=dk.total>0?'总容量 '+gb(dk.total):'硬盘容量未读到';
$('scan-time').textContent=scanTime?'扫描 '+scanTime+'（北京时间）':'';
if(facts.created_at)$('scan-time').dateTime=facts.created_at;
const usedPct=dk.total>0?Math.max(0,Math.min(100,100*used/dk.total)):0;
$('disk-used').style.width=usedPct+'%';$('disk-free').style.width=(100-usedPct)+'%';
$('used-value').textContent=dk.total>0?gb(used):'—';$('free-value').textContent=dk.total>0?gb(dk.free):'—';
$('used-legend').textContent='已用 '+$('used-value').textContent;$('free-legend').textContent='剩余 '+$('free-value').textContent;
$('capacity').setAttribute('aria-label',dk.total>0?'已用 '+gb(used)+'，剩余 '+gb(dk.free):'硬盘容量未读到');
// 比例很悬殊时将标注移到横条下方，保留真实比例，不裁掉数字。
function fitDiskLabels(){
  $('disk').classList.remove('labels-below');
  const narrow=[...document.querySelectorAll('.capacity-segment')].some(s=>s.clientWidth<s.firstElementChild.scrollWidth);
  $('disk').classList.toggle('labels-below',narrow);
}
new ResizeObserver(fitDiskLabels).observe($('disk'));
const deleteMode=D.delete_mode||(D.proposal||{}).delete_mode||'delete';
const signedGB=n=>(n>0?'+':n<0?'−':'')+gb(Math.abs(n));

function catStats(id){const cs=cards.filter(c=>catOf(c)===id);const a=cs.filter(act);
  return {cards:cs,total:sum(cs),can:sum(a),sel:sum(cs.filter(isSel)),acts:a.length}}
function navBtn(key,name,right,cls){
  const b=E('button',null,cls||'');b.type='button';b.setAttribute('aria-current',String(view===key));
  b.append(E('span',name,'nm'));const r=E('span',null,'r');right.forEach(([t,tag])=>r.append(tag?E(tag,t):document.createTextNode(t)));b.append(r);
  b.onclick=()=>{view=key;render();window.scrollTo({top:0})};return b;
}
// 与官网左下角的社交入口一致
const SOCIAL=[['GitHub','https://github.com/sanshengai/sansheng-disk-cleanup'],['反馈问题','https://github.com/sanshengai/sansheng-disk-cleanup/issues'],['公众号','https://sanshengai.top/about/'],['小红书','https://www.xiaohongshu.com/user/profile/5c716b6d000000001000f5c4?xsec_token=YB0ZibE9n6PQ4ZFwQ-T84w0MA0FnGi_yFDgtAGhNHlE70%3D&xsec_source=app_share'],['小宇宙','https://namecard.xiaoyuzhoufm.com/nnl8x']];
function renderNav(){
  const root=$('nav');root.replaceChildren();
  const top=E('div',null,'mod mod-top'), tn=E('div',null,'nav');
  const n=openAsks();
  tn.append(navBtn('overview','总览',n?[['待答 '],[String(n),'b']]:[]));
  if(D.growth)tn.append(navBtn('growth','空间变化',D.growth.baseline?[[signedGB(D.growth.disk_used_delta)]]:[['首次记录']]));
  top.append(tn);root.append(top);
  const sections=[];
  for(const c of CATS){const s=catStats(c.id);if(!s.cards.length)continue;
    let sec=sections.find(x=>x.name===c.section);if(!sec){sec={name:c.section,cats:[]};sections.push(sec)}sec.cats.push([c,s])}
  const maxTot=Math.max(1,...sections.flatMap(x=>x.cats.map(([,s])=>s.total)));
  for(const sec of sections){
    const m=E('div',null,'mod'), tot=sec.cats.reduce((n,[,s])=>n+s.total,0), can=sec.cats.reduce((n,[,s])=>n+s.can,0);
    const h=E('div',null,'mod-h');h.append(E('span',sec.name));const hr=E('span');
    if(can){hr.append('可删 ',E('b',g1(can)),'/'+g1(tot))}else hr.append('留 '+g1(tot));h.append(hr);m.append(h);
    const bar=E('div',null,'mod-bar');const bs=E('span');bs.style.width=(tot?100*can/tot:0)+'%';bar.append(bs);m.append(bar);
    const box=E('div',null,'nav');
    for(const [c,s] of sec.cats){
      const right=s.acts?[['可删 '],[g1(s.can),'b'],['/'+g1(s.total)]]:[['留 '+g1(s.total)]];
      const b=navBtn(c.id,c.name,right,s.acts?'':'keep');
      b.title=s.acts?c.name+'：共 '+gb(s.total)+'，可以腾出 '+gb(s.can)+(s.sel?'，已勾 '+gb(s.sel):''):c.name+'：共 '+gb(s.total)+'，都留着';
      const vol=E('span',null,'vol'),vi=E('i'),vb=E('b');vi.style.width=(100*s.total/maxTot)+'%';vb.style.width=(s.total?100*s.can/s.total:0)+'%';vi.append(vb);vol.append(vi);b.append(vol);
      box.append(b);
    }
    m.append(box);root.append(m);
  }
}

// 单题卡：一张卡问一件事，答案只存在页面里，最后随清单一起复制
function qCard(q){
  const r=PROJ.get(q.key), el=E('div',null,'qcard'+(r.status!==r.orig?' done':''));el.dataset.key=q.key;

  const a=ruleAns.get(r.id), el=E('div',null,'qcard'+(a?' done':''));el.dataset.id=r.id;

    b.onclick=()=>{const y=window.scrollY;if(ruleAns.get(r.id)===k)ruleAns.delete(r.id);else ruleAns.set(r.id,k);render();window.scrollTo({top:y})};g.append(b)}

}
function renderAsks(v){

  const le=ledgerEntries(), extra=le.length>0||hiddenKeys.size>0||ruleAns.size>0;
  const na=archCards().length, archBad=na>0&&!archivePathOk($('arch').value);
  $('archrow').classList.toggle('on',na>0);
  $('archhint').textContent=na?(archBad?'要写成外接硬盘的路径，形如 /Volumes/盘名/文件夹；内置硬盘不行。填好前不能复制。':'共 '+na+' 项选了归档：先搬到这里，核对无误才从电脑上清掉。'):'';
  $('archhint').className='hint'+(archBad?' bad':'');
  $('copy').disabled=!ok||(!s.length&&!extra)||archBad;
  $('selection-help').textContent=!ok?'计划待复核，暂不能执行。':trashMode?'先放废纸篓，清空后释放空间。':'永久删除，不可撤销。';
  $('selection-help').className='hint'+(ok?'':' bad');
  $('ledger-hint').textContent=le.length?'改了项目状态，Agent 会先重新核对再执行':'';
  const q=$('quick');q.replaceChildren();const ap=activePreset(), seenPresets=new Set();
  for(const [p,name] of PRESET){const cs=presetCards(p);if(!cs.length)continue;
    const key=cs.map(c=>c.id).sort().join(',');if(seenPresets.has(key))continue;seenPresets.add(key);
    const b=E('button',name+' '+gb(sum(cs)));b.type='button';b.title=cs.length+' 项。'+PRESET.find(x=>x[0]===p)[2];b.setAttribute('aria-pressed',String(ap===p));b.onclick=()=>choosePreset(p);q.append(b)}
  if(picked.size){const c=E('button','清空');c.type='button';c.title='取消全部选择';c.onclick=()=>choosePreset('');q.append(c)}
  renderNav();
  if($('tally'))fillTally($('tally'));
  const all=$('pick-all');if(all&&catIndex.has(view)){const a=catStats(view).cards.filter(act);all.checked=a.length>0&&a.every(x=>picked.has(x.id))}
  if(view==='overview')renderView();
  const cur=document.querySelector('.nav button[aria-current=true]');if(cur&&matchMedia('(max-width:780px)').matches)cur.scrollIntoView({block:'nearest',inline:'center'});
}
function render(){renderView();update()}

/*SEL-BEGIN*/
// 选择指纹：sha256(JSON{"answers":[…],"archive_to":"…","cards":[…],"seal":"…"})[:12]，键序固定、无空白、不转义非 ASCII；
// archive_to 只在选了归档、目录非空时出现（字典序在 answers 与 cards 之间）；空时不出现，与 0.5 的签名一致。
// 与 plan.py selection_sig 逐字节一致（tests/test_selection.py、tests/test_review_fixes_act.py 会抽出这段在 node 里对照）。
function selPayload(sealDigest,ids,ans,arch){
  const at=String(arch==null?'':arch).trim().replace(/\/+$/,'');
  return '{"answers":'+JSON.stringify(ans.slice().sort())+(at?',"archive_to":'+JSON.stringify(at):'')+',"cards":'+JSON.stringify(ids.slice().sort())+',"seal":'+JSON.stringify(sealDigest)+'}';
}
async function selSig(sealDigest,ids,ans,arch){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(selPayload(sealDigest,ids,ans,arch)));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,12);
}
/*SEL-END*/
async function agentMessage(){
  const ids=selected().map(c=>c.id).sort();
  const ans=cards.filter(c=>isDecide(c)&&picked.has(c.id)).map(c=>c.id+'='+(modeOf.get(c.id)||'删')).sort(); // 选了 删 / 归档 的待定项进清单；选“留”的与没动的一样不进清单，也不会被处理
  const note=cleanNote($('note').value);
  const sel=await selSig(seal?seal.digest:'',ids,ans,archCards().length?archiveNorm($('arch').value):'');
  return ['叁笙清理选择','scan_id: '+(facts.scan_id||plan.scan_id||''),'seal: '+(seal?seal.digest:''),
    '清理: '+(ids.join(', ')||'无'),'回答: '+(ans.join(' / ')||'无'),'sel: '+sel,
    ...(archCards().length?[archiveLine($('arch').value)]:[]),
    ...ruleLines(RULES.filter(r=>ruleAns.get(r.id)==='confirm').map(r=>r.id),RULES.filter(r=>ruleAns.get(r.id)==='reject').map(r=>r.id)),
    ...(ledgerEntries().length?[ledgerLine(ledgerEntries())]:[]),
    ...(hiddenKeys.size?['别再列: '+[...hiddenKeys].sort().join(', ')]:[]),
    '备注: '+(note||'无')].join('\n');
}
$('copy').onclick=async()=>{
  if($('copy').disabled)return;let v;
  try{v=await agentMessage()}catch(e){$('feedback').textContent='当前浏览器不支持生成选择校验码（需要 crypto.subtle，请用 Safari/Chrome 打开）。';return}
  try{await navigator.clipboard.writeText(v);$('fallback').hidden=true;$('feedback').textContent='已复制。回到和 Agent 的对话里粘贴发送，它会接着清理。'}
  catch(e){$('fallback').hidden=false;$('fallback').value=v;$('fallback').select();$('feedback').textContent='浏览器没让自动复制：请按 ⌘C 复制下面已选中的内容，再粘贴给 Agent。'}
};
$('arch').oninput=update;
fillFoot();fillSetline();render();
</script>
