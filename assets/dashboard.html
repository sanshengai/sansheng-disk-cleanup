<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>叁笙清理 · 空间与选择</title>
<style>
:root{--paper:#faf7f0;--ink:#243c2d;--green:#2f5d3a;--gold:#a57924;--line:#d9ddcf;--muted:#68756a;--white:#fffefa;--amber:#88611e;--red:#8a4a3a;--track:#e8ebe0;--rest:#cfd2c6;--sys:#a9ad9f}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:5px 12px;background:var(--white)}
button:hover{border-color:var(--green)}button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input[type=checkbox]{width:17px;height:17px;margin:0;accent-color:var(--green);cursor:pointer}
header,.page{max-width:1240px;margin:auto;padding-left:28px;padding-right:28px}
header{display:flex;align-items:center;gap:20px;padding-top:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;flex:none}.logo{width:104px;height:36px;object-fit:contain}
.brand strong{font-size:16px;font-weight:600;border-left:1px solid var(--line);padding-left:14px}
.disk{margin-left:auto;width:min(420px,45%);font-size:12px;color:var(--muted);text-align:right}
.disk .bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden;margin-top:3px}.disk .bar span{display:block;height:100%;background:var(--green)}
.page{display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;padding-top:16px}
/* 左侧目录：挂在页面左边，跟着滚动停住 */
.side{position:sticky;top:0;height:calc(100vh - 150px);display:flex;flex-direction:column}
.dockbox{flex:1;min-height:0;display:flex;align-items:center}
.dock{width:100%;max-height:calc(100% - 24px);overflow-y:auto;overscroll-behavior:contain}
.side-foot{flex:none;display:flex;flex-wrap:wrap;gap:2px 8px;padding:6px 4px 0;font-size:11px}
.side-foot a,.main-foot a{color:var(--muted);text-decoration:none}.side-foot a:hover,.main-foot a:hover{color:var(--green)}
.main-foot{display:none;flex-wrap:wrap;gap:4px 10px;margin-top:16px;font-size:11px}
.mod-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 10px 4px;font-size:12px;color:var(--muted)}
.mod-h b{font-weight:600}
.mod-bar{height:3px;margin:0 10px 6px;background:var(--track);border-radius:2px;overflow:hidden;display:none}.mod-bar span{display:block;height:100%;background:var(--green)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;justify-content:space-between;align-items:baseline;gap:8px;text-align:left;border:0;border-radius:8px;background:transparent;padding:6px 10px;font-size:13px}
.nav .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .r{flex:none;font-size:12px;color:var(--muted);white-space:nowrap}.nav .r b{font-weight:600;color:var(--green)}
.nav button.keep .nm{color:var(--muted)}
.mod-top .nav button{font-weight:600}
/* 目录：深绿底悬浮导航岛，垂直居中 */
.dock{background:#243c2d;color:#eef0e6;border-radius:16px;padding:10px;box-shadow:0 16px 40px rgba(36,60,45,.28),0 2px 8px rgba(36,60,45,.12)}
.mod{padding:8px 0}.mod+.mod{border-top:1px solid rgba(255,255,255,.10)}
.mod-h{color:#fff;font-size:14px;font-weight:650;padding:4px 10px 6px}.mod-h>span:last-child{font-size:12px;font-weight:400;color:rgba(238,240,230,.6)}.mod-h b{color:#e2c483}
.mod .nav button{padding:5px 10px 5px 22px;font-size:13px;font-weight:400;color:rgba(238,240,230,.82);flex-wrap:wrap;row-gap:4px}
.nav .r{color:rgba(238,240,230,.55)}.nav .r b{color:#e2c483;font-weight:600}
.nav button.keep .nm{color:rgba(238,240,230,.5)}
.mod-top .nav button{padding:6px 10px;font-size:14px;font-weight:650;color:#fff}
.nav .r b.new{color:#e2c483}
.vol{flex-basis:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.vol i{display:block;height:100%;background:rgba(238,240,230,.28);border-radius:2px;position:relative}
.vol i b{position:absolute;left:0;top:0;bottom:0;background:#e2c483;border-radius:2px}
.brand a{display:flex}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current=true]{background:rgba(255,255,255,.12);color:#fff}
/* 右侧 */
.main{min-width:0;padding-bottom:20px}
.main h1{font-size:21px;font-weight:600;margin:0;line-height:1.35}
.lead{margin:4px 0 0;color:var(--muted)}
.stack{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--track);margin:16px 0 6px}
.stack span{display:block;height:100%;min-width:2px}.stack span+span{border-left:2px solid var(--paper)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
table.cats{width:100%;border-collapse:collapse;margin-top:14px}
.cats th{font-size:12px;font-weight:500;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
.cats th:first-child{text-align:left}
.cats td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:top}
.cats td:first-child{text-align:left;white-space:normal}
.cats tr.go{cursor:pointer}.cats tr.go:hover td{background:var(--white)}
.cats .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px}
.cats .muted{color:var(--muted)}.cats .can{color:var(--green);font-weight:600}
.cats tr.grp td{font-size:12px;color:var(--muted);padding-top:16px;border-bottom:0}
.cats .ex{display:block;font-size:12px;color:var(--muted);margin:2px 0 0 18px;max-width:560px}
.tally{display:flex;gap:28px;flex-wrap:wrap;margin:14px 0 4px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tally small{display:block;font-size:12px;color:var(--muted)}.tally strong{font-size:19px;font-weight:600}

.item .tt{font-weight:600;font-size:15px;overflow-wrap:anywhere}

.item .ck{display:flex;justify-content:center;padding-top:3px}
.item .ck .kp{font-size:12px;color:var(--muted)}
.item .sub{grid-column:1;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .q{grid-column:1;font-size:13px;overflow-wrap:anywhere}
.item .risk{grid-column:1;font-size:13px;color:var(--amber)}
.item .down{grid-column:1;font-size:13px;color:var(--muted)}

.item details{grid-column:1}
.item.keep .tt,.item.keep .sz{font-weight:500}

.tag{display:inline-block;font-size:12px;line-height:1.5;padding:0 6px;border:1px solid var(--green);color:var(--green);border-radius:4px;margin-left:8px;font-weight:400;vertical-align:1px}
details.more{font-size:13px}details.more summary{cursor:pointer;color:var(--green);font-size:12px;width:max-content}
details.more dl{display:grid;grid-template-columns:6em minmax(0,1fr);gap:4px 12px;margin:8px 0 2px}
details.more dt{color:var(--muted)}details.more dd{margin:0;overflow-wrap:anywhere}details.more ul{margin:0;padding-left:16px}
code{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere;word-break:break-all}
.sc{color:var(--muted);font-size:12px}
.none{padding:16px 4px;color:var(--muted)}
.tips{margin-top:28px}.tips h2{font-size:15px;margin:0 0 6px}
.tip{padding:10px 0;border-bottom:1px solid var(--line)}.tip .tt{font-weight:600}.tip p{margin:2px 0 0}

.lvl.safe{color:var(--green);border-color:var(--green)}.lvl.recommended{color:#4f7270;border-color:#9fb4b2}.lvl.all{color:var(--amber);border-color:var(--gold)}

/* 我的项目 */

.prow .sz,.prow .ago{text-align:right;white-space:nowrap}.prow .sz{font-weight:650}.prow .ago{color:var(--muted)}
.prow .deliv{grid-column:1/-1}

.deliv .hint{margin:0}
.seg{display:flex;white-space:nowrap}
.seg button{border-radius:0;margin-left:-1px;font-size:12px;padding:4px 10px}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}.seg button:last-child{border-radius:0 6px 6px 0}
.seg button[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}
.backbar{margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.pq{grid-column:1;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.pq button{font-size:12px;padding:2px 10px;border-radius:999px}
.pq button[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}
.hide-btn{grid-column:1;justify-self:start;border:0;background:none;padding:0;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.hide-btn:hover{color:var(--green)}
.item.hidden-rule{opacity:.55}
/* 底部选择栏 */
.selbar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);margin-top:12px}
.selbar .in{max-width:1240px;margin:auto;padding:10px 28px;display:flex;align-items:center;gap:16px}
.selbar strong{font-size:15px}.hint{font-size:12px;color:var(--muted)}.hint.bad{color:var(--red)}

.feedback{font-size:12px;color:var(--muted);min-height:18px}
.fallback{width:100%;height:120px;margin-top:6px}
@media(max-width:780px){
 header,.page,.selbar .in{padding-left:16px;padding-right:16px}

 .page{display:block}
 .side{position:sticky;top:0;z-index:2;height:auto;background:var(--paper);border-bottom:1px solid var(--line);overflow-x:auto;padding:6px 0;margin-bottom:12px;display:block}
 .dock{display:flex;gap:4px;max-height:none;overflow:visible;background:transparent;border:0;box-shadow:none;padding:0;color:inherit}

 .mod-h,.mod-bar,.vol{display:none!important}.nav{flex-direction:row;gap:4px}

 .nav button{border:1px solid var(--line);background:var(--white);white-space:nowrap;color:var(--ink)}
 .nav .r,.nav button.keep .nm{color:var(--muted)}.nav .r b{color:var(--green)}
 .nav button[aria-current=true]{border-color:var(--green);color:var(--green);background:var(--white)}
 .cats .hide-m{display:none}
 .quick button{padding:3px 8px}
 .selbar .in{gap:8px;flex-wrap:wrap}.selbar #selection-help{display:none}.selbar strong{font-size:13px;white-space:nowrap}
 .quick{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto}

<script id="export-lib">
// 导出文本的纯函数：测试在 node 里执行这段，再用 scripts/prefs.py 的 parse_ledger / parse_settings 解析核对。
const STATUS_ZH={active:'进行中',done:'做完了',archived:'归档',protected:'别碰'};
// Python 的 splitlines 会在这些字符处断行；JSON 里一律写成转义，保证“台账:”整行不被拆开
const safeLine=s=>s.replace(/[\u0085\u2028\u2029]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'));
function ledgerLine(entries){ // entries：[{key,name,status,deliverables(数组或 null)}]
  const o=Object.create(null);
  for(const e of entries){if(!STATUS_ZH[e.status])continue;
    const v={'状态':STATUS_ZH[e.status]};
    if(Array.isArray(e.deliverables))v['成品']=e.deliverables;
    if(e.name)v['名称']=e.name;
    o[e.key]=v}
  return '台账: '+safeLine(JSON.stringify({'项目':o}));
}
function settingsLine(s){return '设置: '+safeLine(JSON.stringify({'保留天数':s.days,'默认':s.def}))}
// 扫描只是猜测，不当成用户标注：“做完了”不预选，只在行内用小字提示（用户点过任何状态后提示消失）
function doneHint(p,nowMs){
  if(p.status||p.default_status!=='done')return '';
  const t=Date.parse(p.last_active||''),d=isNaN(t)?0:Math.floor(((nowMs==null?Date.now():nowMs)-t)/864e5);
  return d>0?'看起来做完了（'+d+' 天没动）':'看起来做完了';
}
// 备注是自由文本，进的是按行解析的清单：控制字符、NEL、行/段分隔符（Python splitlines 会在这些处断行）一律换成空格，再折叠空白
function cleanNote(v){return String(v==null?'':v).replace(/[\x00-\x1f\x7f\x85\u2028\u2029]/g,' ').replace(/\s+/g,' ').trim()}
function splitPaths(text){const seen=new Set(),out=[];for(const l of String(text||'').split(/\r?\n/)){const p=l.trim();if(p&&!seen.has(p)){seen.add(p);out.push(p)}}return out}
</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('plan-data').textContent);
const facts=D.facts||{}, plan=D.plan||{}, check=D.check||{errors:[]}, seal=D.seal||null;
const $=id=>document.getElementById(id);
const E=(tag,text,cls)=>{const el=document.createElement(tag);if(text!=null)el.textContent=text;if(cls)el.className=cls;return el};
const fmtBytes=n=>{n=+n||0;const a=Math.abs(n);if(a<1000)return Math.trunc(n)+' B';const sg=n<0?'-':'';
  for(const [u,d] of [['KB',1e3],['MB',1e6],['GB',1e9],['TB',1e12]]){const v=a/d;if(Number(v.toFixed(1))<1000||u==='TB')return sg+v.toFixed(1)+' '+u}}; // 十进制一位小数，与 scripts/units.py 的 fmt_bytes 逐值一致
const gb=n=>{if(n==null)return'未统计';if(n<=0)return'0';return fmtBytes(n)};
const g1=n=>(Math.round((n||0)/1e8)/10).toLocaleString('zh-CN',{minimumFractionDigits:1,maximumFractionDigits:1}); // 目录里的短写：9.7
const LABEL={clean:'建议清理',decide:'需你决定',keep:'保留'};
const SCOPE={all:'整个目录','ignored-only':'只删 git 忽略的文件',files:'指定文件'};
const COLORS=['#2f5d3a','#5f8a6a','#93ad86','#a57924','#c9a35a','#4f7270','#7f9c9a','#b7a37a','#8c9a6c','#6e7a63','#dcd6c4'];
const CATS=(plan.categories&&plan.categories.length?plan.categories:[{id:'other',name:'其他',section:'',desc:''}]);
const catIndex=new Map(CATS.map((c,i)=>[c.id,i]));
const colorOf=id=>COLORS[(catIndex.get(id)||0)%COLORS.length];
const cards=(plan.cards||[]).filter(c=>LABEL[c.verdict]).sort((a,b)=>(b.bytes||0)-(a.bytes||0));
// 项目做完了 / 归档的待定卡：回答默认选“删”（plan.py 预填，仍要用户确认；用户取消勾选即不清理）
const prefillOf=c=>c.prefill==='删'||!!(D.proposal&&D.proposal.prefill&&D.proposal.prefill[c.id]==='删');
// 勾选＝要清理，没勾＝不动。clean 卡初始按 plan.py 算出的 default_select 预勾选（c.verdict==='clean'&&c.default_select===true）；decide 卡只有项目做完了（prefillOf）才预勾选
const picked=new Set(cards.filter(c=>(c.verdict==='clean'&&c.default_select===true)||(c.verdict==='decide'&&prefillOf(c))).map(c=>c.id));
const catOf=c=>catIndex.has(c.category)?c.category:'other';
const sum=a=>a.reduce((n,c)=>n+(c.bytes||0),0);
const act=c=>c.verdict!=='keep';
const isSel=c=>act(c)&&picked.has(c.id);
let view='overview';
const S=D.settings||{};
const cfg={days:Number.isInteger(S.retention_days)&&S.retention_days>0?S.retention_days:0,def:['safe','recommended','all'].includes(S.default_choice)?S.default_choice:'recommended'};

function renderNav(){

    let sec=sections.find(x=>x.name===c.section);if(!sec){sec={name:c.section,cats:[]};sections.push(sec)}sec.cats.push([c,s])}
  const maxTot=Math.max(1,...sections.flatMap(x=>x.cats.map(([,s])=>s.total)));
  for(const sec of sections){

const EV_KIND={merged:'已合并',delivered:'已交付',copy_verified:'副本已核对',user_stated:'用户说明（不算结束证据）',refs_reviewed:'引用已核对'};
function evText(e){if(typeof e==='string')return e;if(!e||typeof e!=='object')return String(e);
  const k=EV_KIND[e.kind]||e.kind||'证据';const rest=Object.entries(e).filter(([x])=>x!=='kind').map(([x,v])=>x+'='+(typeof v==='object'?JSON.stringify(v):v)).join('，');
  return k+(rest?'：'+rest:'')}
const plain=s=>typeof s==='string'&&s.trim()&&s.trim()!=='无'?s.trim():'';
function detail(c){
  const d=E('details','','more');d.append(E('summary','详情'));
  const dl=E('dl');
  if(plain(c.impact)&&act(c))dl.append(E('dt','删了会怎样'),E('dd',c.impact));
  if((c.evidence||[]).length){const ul=E('ul');c.evidence.forEach(e=>ul.append(E('li',evText(e))));const dd=E('dd');dd.append(ul);dl.append(E('dt','判断依据'),dd)}
  if((c.evidence_verified||[]).length){const ul=E('ul');c.evidence_verified.forEach(v=>ul.append(E('li',evText(v.evidence)+(v.msg?'（'+v.msg+'）':''))));const dd=E('dd');dd.append(ul);dl.append(E('dt','已复核'),dd)}
  if((c.risk_notes||[]).length)dl.append(E('dt','逐条提示'),E('dd',c.risk_notes.length.toLocaleString('zh-CN')+' 条，原因见上方“留意”'));
  if((c.check_groups||[]).length){
    const dd=E('dd');
    for(const g of c.check_groups){
      const p=E('div');p.append(g.reason+(g.count>1?'（共 '+g.count.toLocaleString('zh-CN')+' 条）':''));
      const ex=E('div',null,'sc');(g.examples||[]).forEach(x=>ex.append(E('code',x),E('br')));if(ex.childNodes.length)p.append(ex);
      dd.append(p);
    }
    if(c.check_groups_more>0)dd.append(E('div','……另有 '+c.check_groups_more+' 类原因','sc'));
    dl.append(E('dt','复核结果'),dd);
  }
  if((c.items||[]).length){
    const dd=E('dd');
    for(const it of c.items){
      const p=E('div');p.append(E('code',it.path||(it.argv||[]).join(' ')));
      p.append(E('span',' · '+(it.method==='native'?'用软件自带命令删除':(SCOPE[it.scope]||'删除'))+(it.files_total?' '+it.files_total+' 个文件':''),'sc'));
      dd.append(p);
    }
    if(c.items_total>c.items.length)dd.append(E('div','……共 '+c.items_total.toLocaleString('zh-CN')+' 条，这里只列前 '+c.items.length+' 条','sc'));
    dl.append(E('dt','位置'),dd);
  }
  dl.append(E('dt','编号'),E('dd',c.id));
  d.append(dl);return d;
}
function itemEl(c){

  const t=E('div',c.title,'tt');if(c.preset)t.append(E('span',LVL[c.preset],'lvl '+c.preset));
  if(c.preset_raw==='all'&&c.preset!=='all')t.append(E('span','删了找不回','lvl all')); // 被归档项目降到推荐档，但东西仍是删了找不回的
  const ck=E('div',null,'ck');
  if(act(c)){
    const i=document.createElement('input');i.type='checkbox';i.checked=picked.has(c.id);i.setAttribute('aria-label','清理 '+c.title);
    i.onchange=()=>{i.checked?picked.add(c.id):picked.delete(c.id);el.classList.toggle('on',i.checked);update()};ck.append(i);
  }else ck.append(E('span','留着','kp'));

  const sub=[c.source?'来自 '+c.source:'',plain(c.summary)].filter(Boolean).join('。');
  if(sub)el.append(E('div',sub,'sub'));
  for(const pj of (c.projects||[]).slice(0,3)){
    const r=PROJ.get(pj.key)||addProj({key:pj.key,name:pj.name,status:pj.status});
    const row=E('div',null,'pq');row.append('属于「'+r.p.name+'」');
    for(const [st,label] of [['done','这个项目做完了'],['active','还在做']]){const b=E('button',label);b.type='button';b.setAttribute('aria-pressed',String(r.status===st));b.onclick=()=>setStatus(r,st);row.append(b)}
    el.append(row)}
  if(c.verdict==='decide'&&prefillOf(c))el.append(E('div','项目已标“做完了”，这一项先替你勾上了；不想清就取消勾选。','sub'));

    const ul=E('ul');(dr.length?dr:['原因未记录']).forEach(t=>ul.append(E('li',t)));
    if(c.down_more>0)ul.append(E('li','另有 '+c.down_more+' 类原因，见详情'));dn.append(ul);el.append(dn)}
  for(const r of (c.risk_summary||[]))el.append(E('div','留意：'+r.text+(r.count>1?'（涉及 '+r.count.toLocaleString('zh-CN')+' 处）':''),'risk'));
  if(act(c)&&c.rule_key){const h=E('button',hiddenKeys.has(c.rule_key)?'以后不再列这类（撤销）':'以后别列这类','hide-btn');h.type='button';
    h.title='这一类以后一律留着、不再列出来；会和清单一起告诉 Agent';
    h.onclick=()=>{if(hiddenKeys.has(c.rule_key))hiddenKeys.delete(c.rule_key);else{hiddenKeys.add(c.rule_key);cards.filter(x=>x.rule_key===c.rule_key).forEach(x=>picked.delete(x.id))}render()};
    el.append(h);if(hiddenKeys.has(c.rule_key))el.classList.add('hidden-rule')}
  el.append(detail(c));return el;

  const ta=document.createElement('textarea');ta.value=r.deliv.join('\n');ta.placeholder='一行一个目录，例如 ~/Projects/短剧/成品';ta.setAttribute('aria-label',p.name+' 的成品目录');
  ta.oninput=()=>{r.deliv=splitPaths(ta.value);r.delivEdited=true;sm.textContent='成品在哪'+(r.deliv.length?'（'+r.deliv.length+' 处）':'');update()};
  d.append(ta,E('p','清理时，有副本的才放心清；清理前也会在这里查有没有文档引用了要清的东西。','hint'));
  el.append(d);return el;
}
function renderProjects(v){
  v.append(E('h1','我的项目'));
  v.append(E('p','标一下每个项目现在的状态，清理就按你的习惯来。改动会随清单一起复制给 Agent。','lead'));

  {const d=sec('AI 对话留多久','最近这些天里用过的对话一律留着，不列为可清。');const o=E('div',null,'opts');
    for(const n of S.retention_choices||[0,7,15,30]){const l=E('label');const i=document.createElement('input');i.type='radio';i.name='days';i.checked=cfg.days===n;

  {const d=sec('平时默认清到哪一档','以后在对话里回一句“好”，就按这一档清。');const o=E('div',null,'opts');
    for(const [p,name,desc] of PRESET){const l=E('label');l.title=desc;const i=document.createElement('input');i.type='radio';i.name='def';i.checked=cfg.def===p;
      i.onchange=()=>{cfg.def=p;touch()};l.append(i,name);o.append(l)}d.append(o)}
  const bar=E('div',null,'backbar');const back=E('button','回到清单');back.type='button';back.id='back';back.onclick=()=>{view='overview';render();window.scrollTo({top:0})};bar.append(back);v.append(bar);

function renderView(){
  const v=$('view');v.replaceChildren();
  if(view!=='projects'){const t=newTip();if(t)v.append(t)}
  if(view==='projects')renderProjects(v);
  else if(view!=='overview'&&catIndex.has(view))renderCategory(v,view);else renderOverview(v);
}
function selected(){return cards.filter(isSel)}
function update(){
  const s=selected();
  $('selected').textContent=s.length?'已勾 '+s.length+' 项，预计腾出 '+gb(sum(s)):'尚未勾选';
  const ok=!!(seal&&seal.digest);
  const le=ledgerEntries(), extra=settingsTouched||le.length>0||hiddenKeys.size>0;
  $('copy').disabled=!ok||(!s.length&&!extra);
  $('selection-help').textContent=!ok?'计划尚未封存，先让 Agent 运行 plan.py seal'
    :'这个页面自己不会删东西。复制清单粘贴给 Agent，它会先演练一遍、再删一条试试，确认没问题才删其余的；没勾的一律不动。';
  $('selection-help').className='hint'+(ok?'':' bad');
  $('ledger-hint').textContent=le.length?'改了项目状态，Agent 会先重新核对再执行':'';
  const q=$('quick');q.replaceChildren();const ap=activePreset();

  if(picked.size){const c=E('button','清空');c.type='button';c.title='取消全部勾选';c.onclick=()=>choosePreset('');q.append(c)}
  renderNav();
  if($('tally'))fillTally($('tally'));
  const all=$('pick-all');if(all&&catIndex.has(view)){const a=catStats(view).cards.filter(act);all.checked=a.length>0&&a.every(x=>picked.has(x.id))}
  if(view==='overview')renderView();
  const cur=document.querySelector('.nav button[aria-current=true]');if(cur&&matchMedia('(max-width:780px)').matches)cur.scrollIntoView({block:'nearest',inline:'center'});
}
function render(){renderView();update()}

/*SEL-BEGIN*/
// 选择指纹：sha256(JSON{"answers":[…],"cards":[…],"seal":"…"})[:12]，键序固定、无空白、不转义非 ASCII；
// 与 plan.py selection_sig 逐字节一致（tests/test_selection.py 会抽出这段在 node 里对照）。
function selPayload(sealDigest,ids,ans){
  return '{"answers":'+JSON.stringify(ans.slice().sort())+',"cards":'+JSON.stringify(ids.slice().sort())+',"seal":'+JSON.stringify(sealDigest)+'}';
}
async function selSig(sealDigest,ids,ans){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(selPayload(sealDigest,ids,ans)));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,12);
}
/*SEL-END*/
async function agentMessage(){
  const ids=selected().map(c=>c.id).sort();
  const ans=cards.filter(c=>c.verdict==='decide'&&picked.has(c.id)).map(c=>c.id+'=删').sort(); // 勾选的待定项即“删”；没勾的不进清单，也不会被删
  const note=cleanNote($('note').value);
  const sel=await selSig(seal?seal.digest:'',ids,ans);
  return ['叁笙清理选择','scan_id: '+(facts.scan_id||plan.scan_id||''),'seal: '+(seal?seal.digest:''),
    '清理: '+(ids.join(', ')||'无'),'回答: '+(ans.join(' / ')||'无'),'sel: '+sel,
    ...(settingsTouched?[settingsLine(cfg)]:[]),
    ...(ledgerEntries().length?[ledgerLine(ledgerEntries())]:[]),
    ...(hiddenKeys.size?['别再列: '+[...hiddenKeys].sort().join(', ')]:[]),
    '备注: '+(note||'无')].join('\n');
}
$('copy').onclick=async()=>{
  if($('copy').disabled)return;let v;
  try{v=await agentMessage()}catch(e){$('feedback').textContent='当前浏览器不支持生成选择校验码（需要 crypto.subtle，请用 Safari/Chrome 打开）。';return}
  try{await navigator.clipboard.writeText(v);$('fallback').hidden=true;$('feedback').textContent='已复制。回到和 Agent 的对话里粘贴发送，它会接着清理。'}
  catch(e){$('fallback').hidden=false;$('fallback').value=v;$('fallback').select();$('feedback').textContent='浏览器没让自动复制：请按 ⌘C 复制下面已选中的内容，再粘贴给 Agent。'}
};
fillFoot();render();
